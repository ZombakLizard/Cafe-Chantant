<body>
    <div id="background"></div>
    <div id="overlay"></div>
    <div id="rain"></div>
    <div id="wind"></div>
    <header>
        <img src="header.jpg" id="headerImage" alt="Шапка кафе">
    </header>
    <main>
        <div class="glass">
            <h2>Введите протокол</h2>
            <input id="protocol" type="text" autocomplete="off" spellcheck="false">
            <button id="confirm">Подтвердить</button>
        </div>
    </main>
    <section id="terminal">
        <div class="terminalWindow">
            <h1>Кафе Шантан</h1>
            <pre id="output"></pre>
        </div>
    </section>
    <button id="printAll">Напечатать всё</button>
    <footer>
        <p>© Кафе Шантан 2026 | by <a href="https://steamcommunity.com/id/zombaklizard/" target="_blank" rel="noopener">ZombakLizard</a></p>
    </footer>

    <script>
        const input = document.getElementById("protocol");
        const button = document.getElementById("confirm");
        const glass = document.querySelector(".glass");
        const terminal = document.getElementById("terminal");
        const output = document.getElementById("output");
        const rain = document.getElementById("rain");
        const wind = document.getElementById("wind");
        const printAllBtn = document.getElementById("printAll");

        let typewriterTimer = null;
        let activeProtocol = null; // 'rain' или 'wind'

        const protocolRain = `Протокол K051C принят.

Протокол K051C принят. Пожалуйста, определите тип угрозы и соблюдайте инструкции 

· I — можно игнорировать.
· II — надо закрыть.
· III — надо спрятать.
· IV — надо уйти.
· V — надо спасаться.

🌧️ K051C(I) — Легкий дождь 

· Признак: Капли не ощутимы
· Действие:
1. Проверить, что Самиздат застёгнута и все содержимое. 

 ☔️ K051C(II) — Умеренный дождь 

· Признак: Капли отчётливо слышны, но нет потоков воды.
· Действие:
1. Спрятать Самиздат в основное отделение. 
2. Проверить все содержимое Самиздат. 
3. Одеть дождевик 

☔️ K051C(III) — Сильный дождь 

· Признак: Вода течёт по одежде, трудно идти, ветер раскачивает. 
· Действие: 
1. Переместить Самиздат в герметичный мешок.
2. Проверить все содержимое Самиздат. 
3. Спрятать кабель питания Самиздат на левой лямке. 
4. Одеть дождевик 
5. Постараться найти укрытие 

(Все проверки проводить на ощупь)

⛈️ K051C(IV) — Ливень 

· Признак: Вода льёт стеной, видимость плохая, молнии рядом, можно захлебнутся 
· Действие: 
1. Искать укрытие
2. Переместить Самиздат в герметичный мешок. 
3. Проверить все содержимое Самиздат. 
4. Спрятать кабель питания Самиздат на левой лямке. 
5. Проверить порты в отсеке N3.
6. Одеть дождевик 

(Все проверки проводить на ощупь)

⛈️ K051C(V) — Экстремальный ливень

· Признак: Вода заливает всё вокруг, опасно находиться на улице. Молнии бьют рядом. Уровень воды стремительно поднимается
· Действие: 
1. Искать укрытие
2. Переместить Самиздат в герметичный мешок. 
3. Проверить все содержимое Самиздат. 
4. Спрятать кабель питания Самиздат на левой лямке. 
5. Проверить порты в отсеке N3.
6. Спрятать все модули внутрь дрейдла. 
7. Одеть дождевик 

(Все проверки проводить на ощупь)
`;

        const protocolWind = `Протокол I300B принят.

Протокол I300B принят. Пожалуйста, определите тип угрозы и соблюдайте инструкции.

· I — можно игнорировать.
· II — надо закрепить.
· III — надо спрятать.
· IV — надо уйти.
· V — надо спасаться.

🌬️ I300B(I) — Сильный ветер

· Признак: Ветер постоянно ощущается, одежда развивается, мелкие ветки качаются.
· Действие:
1. Проверить, что все внешние модули надежно закреплены.
2. Проверить Самиздат.
3. Проверить фастексы Дрейдла.

🌪️ I300B(II) — Очень сильный ветер

· Признак: Идти становится некомфортно, ветер сбивает капюшон, с деревьев летят мелкие ветки.
· Действие:
1. Убрать Самиздат в основное отделение.
2. Спрятать все модули в основное отделение.
3. Спрятать все предметы с навесным креплением.

🌪️ I300B(III) — Штормовой ветер

· Признак: Ветер заметно мешает идти, возможны падения небольших веток и лёгких предметов.
· Действие:
1. Убрать Самиздат в основное отделение.
2. Спрятать все модули в основное отделение.
3. Спрятать все предметы с навесным креплением.
4. Не проходить под деревьями и рекламными конструкциями.

🌪️ I300B(IV) — Ураган

· Признак: Идти крайне трудно, ветер способен валить ветки и небольшие деревья, возможны летающие предметы.
· Действие:
1. Немедленно искать капитальное укрытие.
2. Убрать Самиздат в основное отделение.
3. Спрятать все модули в основное отделение.
4. Спрятать все предметы с навесным креплением.
5. Не проходить под деревьями и рекламными конструкциями.
6. При условии что Дрейдл нагружен и для модулей нету места - отбросить предметы не из системы Дрейдл.

🌪️ I300B(V) — Экстремальный ураган

· Признак: Передвигаться практически невозможно. Летают крупные предметы, разрушаются конструкции, существует непосредственная угроза жизни.
· Действие:
1. Немедленно укрыться в капитальном сооружении.
2. Полностью прекратить движение, если укрытие найдено.
3. Не покидать укрытие до окончания ветра.
4. Убрать Самиздат в основное отделение.
5. Спрятать все модули в основное отделение.
6. Спрятать все предметы с навесным креплением.
7. Не проходить под деревьями и рекламными конструкциями.
8. При условии что Дрейдл нагружен и для модулей нету места - отбросить предметы не из системы Дрейдл.
`;

        button.addEventListener("click", checkProtocol);
        input.addEventListener("keydown", e => {
            if (e.key === "Enter") checkProtocol();
        });

        printAllBtn.addEventListener("click", () => {
            if (typewriterTimer) {
                clearInterval(typewriterTimer);
                typewriterTimer = null;
            }
            if (activeProtocol === 'rain') {
                output.textContent = protocolRain;
            } else if (activeProtocol === 'wind') {
                output.textContent = protocolWind;
            }
            printAllBtn.style.display = "none";
        });

        function checkProtocol() {
            const val = input.value.trim().toUpperCase();
            if (val === "K051C") {
                activateProtocol('rain', protocolRain);
            } else if (val === "I300B") {
                activateProtocol('wind', protocolWind);
            } else {
                input.animate([
                    { transform: "translateX(-8px)" },
                    { transform: "translateX(8px)" },
                    { transform: "translateX(-8px)" },
                    { transform: "translateX(0)" }
                ], { duration: 350 });
            }
        }

        function activateProtocol(type, text) {
            // Сброс предыдущих классов
            document.body.classList.remove("protocol-rain", "protocol-wind");
            // Скрываем эффекты
            rain.style.opacity = '0';
            wind.style.opacity = '0';
            // Очищаем контейнеры эффектов
            rain.innerHTML = '';
            wind.innerHTML = '';

            activeProtocol = type;
            document.body.classList.add(type === 'rain' ? 'protocol-rain' : 'protocol-wind');

            // Запуск анимации эффектов
            if (type === 'rain') {
                createRain();
            } else if (type === 'wind') {
                createWind();
            }

            // Анимация исчезновения формы ввода
            glass.animate([
                { opacity: 1, transform: "translateY(0px)" },
                { opacity: 0, transform: "translateY(-20px)" }
            ], {
                duration: 700,
                fill: "forwards"
            });

            setTimeout(() => {
                glass.style.display = "none";
                terminal.style.display = "block";
                terminal.style.animation = "fade .8s";
                printAllBtn.style.display = "inline-block";
                typeWriter(text);
            }, 700);
        }

        function typeWriter(text) {
            output.textContent = "";
            let i = 0;
            typewriterTimer = setInterval(() => {
                output.textContent += text.charAt(i);
                i++;
                if (i >= text.length) {
                    clearInterval(typewriterTimer);
                    typewriterTimer = null;
                    printAllBtn.style.display = "none";
                }
            }, 15);
        }

        function createRain() {
            rain.innerHTML = "";
            for (let i = 0; i < 180; i++) {
                const drop = document.createElement("div");
                drop.className = "drop";
                drop.style.left = Math.random() * 100 + "vw";
                drop.style.height = 50 + Math.random() * 120 + "px";
                drop.style.animationDuration = 0.8 + Math.random() * 1.3 + "s";
                drop.style.animationDelay = Math.random() * 2 + "s";
                rain.appendChild(drop);
            }
            rain.style.opacity = '1';
        }

        function createWind() {
            wind.innerHTML = "";

            // Линии ветра
            for (let i = 0; i < 60; i++) {
                const particle = document.createElement("div");
                particle.className = "wind-particle";
                particle.style.top = Math.random() * 100 + "vh";
                particle.style.width = 80 + Math.random() * 200 + "px";
                particle.style.animationDuration = 1.5 + Math.random() * 2.5 + "s";
                particle.style.animationDelay = Math.random() * 3 + "s";
                wind.appendChild(particle);
            }

            // Пылевые частицы
            for (let i = 0; i < 40; i++) {
                const dust = document.createElement("div");
                dust.className = "dust-particle";
                dust.style.width = 2 + Math.random() * 5 + "px";
                dust.style.height = dust.style.width;
                dust.style.top = Math.random() * 100 + "vh";
                dust.style.animationDuration = 2 + Math.random() * 4 + "s";
                dust.style.animationDelay = Math.random() * 5 + "s";
                wind.appendChild(dust);
            }

            wind.style.opacity = '1';
        }
    </script>
</body>
